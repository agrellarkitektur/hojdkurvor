# Kontrollerar appen och laddar upp den till webbhotellet med FTP vid varje
# push till main (ändringar som bara rör dokumentationen hoppas över). Kan
# också köras för hand under Actions → "Publicera på webbhotellet" → "Run
# workflow".
#
# Uppgifterna ligger som secrets i repot (Settings → Secrets and variables →
# Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD och FTP_DIR (mappen på
# servern, t.ex. /agrellarkitektur.se/public_html/terrang/).
#
# Samma urval som zip-filen i release.yml: allt utom test, docs, .github,
# CLAUDE.md och .gitignore. config.js följer med och ska vara utan nycklar.
#
# Första gången laddas allt upp; sedan bara det som ändrats (uppladdningen
# sparar en lista i .ftp-deploy-sync-state-2.json på servern). Filer på servern
# som inte kommer från repot rörs inte. Listan bytte namn i 0.8.1, när 0.8.0
# visade sig sakna filer på servern; då laddades allt upp en gång till.
#
# Efter uppladdningen hämtas varje fil från webbplatsen och jämförs med repot
# (.github/scripts/kontrollera-webbplatsen.sh). Filer som saknas eller är gamla
# laddas upp igen med curl, och körningen misslyckas om de ändå inte stämmer.
# Webbadressen kan ändras med variabeln SIDA_URL (Settings → Variables).
#
# Alla actions körs med Node 24 sedan 0.8.2 (checkout@v7, setup-node@v7,
# FTP-Deploy-Action@v4.4.0). Byt när GitHub varnar för en äldre Node-version.

name: Publicera på webbhotellet

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'test/**'
  workflow_dispatch:

concurrency:
  group: publicera
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Kontrollera koden
        run: |
          for f in js/*.js config.js; do node --check "$f"; done
          # Ubuntu 26 (ubuntu-latest från hösten 2026) har kanske inte PHP med.
          command -v php >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q php-cli; }
          for f in *.php; do php -l "$f"; done

      - name: Enhetstest
        run: for f in test/*.test.js; do node "$f"; done

      - name: Kontrollera inställningarna
        run: |
          # Inga nycklar eller inloggningar får följa med till webbhotellet.
          node -e "
            global.window = {};
            require('./config.js');
            const k = window.TERRANG_KONFIG;
            if (k.esriNyckel || k.inloggning) { console.error('config.js innehåller en nyckel eller inloggning'); process.exit(1); }
          "

      - name: Packa urvalet
        run: |
          mkdir -p ut
          git archive HEAD -- . ':!test' ':!docs' ':!.github' ':!CLAUDE.md' ':!.gitignore' | tar -x -C ut

      - name: Mappen på servern
        id: dir
        env:
          DIR: ${{ secrets.FTP_DIR }}
        # Uppladdningen kräver / i början och på slutet.
        run: |
          DIR="/${DIR#/}"; DIR="${DIR%/}/"
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

      - name: Ladda upp till webbhotellet
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.dir.outputs.path }}
          local-dir: ./ut/
          protocol: ftps
          # Webbhotellets certifikat gäller ofta värdnamnet hos leverantören,
          # inte det egna domännamnet; anslutningen krypteras ändå.
          security: loose
          state-name: .ftp-deploy-sync-state-2.json

      - name: Kontrollera webbplatsen
        env:
          SIDA: ${{ vars.SIDA_URL || 'https://agrellarkitektur.se/terrang/' }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ steps.dir.outputs.path }}
        run: |
          sleep 5
          bash .github/scripts/kontrollera-webbplatsen.sh
